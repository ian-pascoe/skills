name: release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
          run-install: |
            args: ["--frozen-lockfile", "--ignore-scripts"]

      # No npm publish: `changeset git-tag` tags the release, and the action
      # pushes the tag and creates the GitHub release from CHANGESETS_OUTPUT.
      - uses: changesets/action@v2
        with:
          version-script: vp run version
          publish-script: pnpm changeset git-tag
          create-github-releases: true
          commit-message: "chore: version skills"
          pr-title: "chore: version skills"
